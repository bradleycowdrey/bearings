name: iPhone

# Builds the iPhone and iPad app with its widget, checks the packaged widget, and runs the app in the
# iOS Simulator: --selftest with the Simulator placed at Maroon Bells, Colorado (location fix, live
# ground elevation, naming the place, the compass's "no compass" state, every widget size drawn, the
# layout planner's golden table: nothing empty, nothing cut, every dial at its floor, rows that add up to
# C, neighbouring layouts 24 apart or on a different grid), then photographs the terms, the live screen,
# the sample place, every layout (--layout small|large|extraLarge; the rest use the Medium default), the
# map sheet (--map-sheet) and the no-compass state (--no-compass) on iPhone and iPad, larger text and an
# accessibility size on iPhone, and iPad in landscape (docs/LAYOUTS.md §8).
# Results go to the ci-shots-ios branch; the job fails if any check fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build for the Simulator
        run: scripts/build-ios.sh 0.0.0-ci
      - name: Check the packaged widget
        run: |
          A=dist/ios/Bearings.app; W="$A/PlugIns/BearingsWidget.appex"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$W/Info.plist" | grep -q com.apple.widgetkit-extension \
            || { echo "::error::The iPhone widget isn't declared as a WidgetKit extension"; exit 1; }
          plutil -extract NSWidgetWantsLocation raw "$W/Info.plist" | grep -q true \
            || { echo "::error::The iPhone widget doesn't ask for its own location (NSWidgetWantsLocation)"; exit 1; }
          [ -s "$W/Cities.tsv" ] && [ -s "$A/Cities.tsv" ] || { echo "::error::The place list (Cities.tsv) isn't bundled"; exit 1; }
          for X in "$A" "$W"; do
            codesign -d --entitlements - --xml "$X" 2>/dev/null | plutil -convert xml1 -o - - | grep -q 'group.com.bradcowdrey.bearings' \
              || echo "::warning::$(basename "$X") has no App Group in its Simulator signature"
          done
          test -f "$A/Assets.car" || { echo "::error::The iPhone app has no asset catalog (icon)"; exit 1; }
      - name: Run in the Simulator
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          # The app's clock in Colorado, where the Simulator is placed (it runs on UTC otherwise).
          export SIMCTL_CHILD_TZ=America/Denver
          ID=com.bradcowdrey.bearings
          pick() {   # newest iOS runtime's device whose name starts with $1
            xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          xs=[(r,x) for r,xs in d.items() if "iOS" in r for x in xs if x["name"].startswith(sys.argv[1])]
          xs.sort(key=lambda p:(p[0], "Pro" in p[1]["name"] and "Max" not in p[1]["name"]))
          print(xs[-1][1]["udid"])' "$1"
          }
          run_on() {   # $1 = device, $2 = prefix
            local DEVICE="$1" P="$2"
            xcrun simctl list devices | grep "$DEVICE" | tee -a "$OUT/device.txt"
            xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            xcrun simctl install "$DEVICE" dist/ios/Bearings.app
            xcrun simctl privacy "$DEVICE" grant location $ID || true
            xcrun simctl location "$DEVICE" set 39.09898,-106.94117 || true
            xcrun simctl launch "$DEVICE" $ID --show-terms; sleep 6
            xcrun simctl io "$DEVICE" screenshot "$OUT/$P-1-terms.png"; xcrun simctl terminate "$DEVICE" $ID || true
            xcrun simctl launch "$DEVICE" $ID --sample; sleep 6
            xcrun simctl io "$DEVICE" screenshot "$OUT/$P-2-sample.png"; xcrun simctl terminate "$DEVICE" $ID || true
            xcrun simctl launch "$DEVICE" $ID --sample --format mgrs; sleep 6
            xcrun simctl io "$DEVICE" screenshot "$OUT/$P-3-mgrs.png"; xcrun simctl terminate "$DEVICE" $ID || true
            # Every layout (docs/LAYOUTS.md); shown for the launch only, never saved.
            shoot_layout "$DEVICE" small "$P-6-small"
            shoot_layout "$DEVICE" large "$P-7-large"
            shoot_layout "$DEVICE" extraLarge "$P-8-xl"
            # The map sheet (the Map tile's full-height sheet), opened at launch with --map-sheet.
            xcrun simctl launch "$DEVICE" $ID --sample --format dd --map-sheet; sleep 8
            xcrun simctl io "$DEVICE" screenshot "$OUT/$P-10-map-sheet.png"; xcrun simctl terminate "$DEVICE" $ID || true
            # No compass with the sample place: "—°", NO HEADING, the rose at 40%, Medium's tiles at 72 and a 160 map card where it fits.
            xcrun simctl launch "$DEVICE" $ID --sample --format dd --no-compass; sleep 6
            xcrun simctl io "$DEVICE" screenshot "$OUT/$P-11-no-compass.png"; xcrun simctl terminate "$DEVICE" $ID || true
          }
          shoot_layout() {   # $1 = device, $2 = layout id, $3 = file name (no .png)
            # --format dd: the -3-mgrs shot saved MGRS as the format; the layout itself is never saved.
            xcrun simctl launch "$1" $ID --sample --format dd --layout "$2"; sleep 6
            xcrun simctl io "$1" screenshot "$OUT/$3.png"; xcrun simctl terminate "$1" $ID || true
          }
          PHONE=$(pick iPhone)
          run_on "$PHONE" iphone
          # The iPhone's Text Size turned up: the screen must still fit, with larger type; tiles grow
          # and coordinates wrap rather than end in "…".
          xcrun simctl ui "$PHONE" content_size extra-extra-large || true
          xcrun simctl launch "$PHONE" $ID --sample --format dd; sleep 6
          xcrun simctl io "$PHONE" screenshot "$OUT/iphone-5-large-text.png"; xcrun simctl terminate "$PHONE" $ID || true
          # The same Text Size at Extra Large: the planner gives things up (or scrolls as one list), nothing is cut.
          shoot_layout "$PHONE" extraLarge iphone-9-xl-large-text
          # The first accessibility size (AX1): the whole screen is one scrolling list, its first screen
          # ending on a whole block, the indicator flashed (docs/LAYOUTS.md §7).
          xcrun simctl ui "$PHONE" content_size accessibility-medium || true
          xcrun simctl launch "$PHONE" $ID --sample --format dd; sleep 6
          xcrun simctl io "$PHONE" screenshot "$OUT/iphone-12-ax1.png"; xcrun simctl terminate "$PHONE" $ID || true
          xcrun simctl ui "$PHONE" content_size large || true
          # The self-test, with a real location fix and network.
          DOCS="$(xcrun simctl get_app_container "$PHONE" $ID data)/Documents"; mkdir -p "$DOCS"; rm -f "$DOCS/report.txt"
          xcrun simctl launch "$PHONE" $ID --selftest
          for i in $(seq 1 150); do [ -f "$DOCS/report.txt" ] && break; sleep 1; done
          sleep 2; xcrun simctl io "$PHONE" screenshot "$OUT/iphone-4-live.png"
          cp "$DOCS/report.txt" "$OUT/report.txt" 2>/dev/null || echo "FAILED (no report)" > "$OUT/report.txt"
          cp "$DOCS"/*.png "$OUT/" 2>/dev/null || true
          xcrun simctl terminate "$PHONE" $ID || true
          xcrun simctl shutdown "$PHONE" || true
          IPAD=$(pick iPad)
          run_on "$IPAD" ipad
          # iPad in landscape (two panes), if the Simulator window can be rotated here. Best effort:
          # simctl has no rotate command, so this goes through the Simulator app's Device menu.
          open -a Simulator --args -CurrentDeviceUDID "$IPAD" || true; sleep 8
          rotate() {   # $1 = Left or Right; gives up after 20 s (a permissions prompt can't block the job)
            osascript -e "tell application \"System Events\" to tell process \"Simulator\" to click menu item \"Rotate $1\" of menu \"Device\" of menu bar 1" >/dev/null 2>&1 &
            local PID=$!; ( sleep 20; kill $PID ) >/dev/null 2>&1 & local WATCH=$!
            local RC=0; wait $PID || RC=$?; kill $WATCH 2>/dev/null || true; return $RC
          }
          if rotate Left; then
            sleep 3
            xcrun simctl launch "$IPAD" $ID --sample --format dd; sleep 6
            xcrun simctl io "$IPAD" screenshot "$OUT/ipad-9-landscape.png"; xcrun simctl terminate "$IPAD" $ID || true
            # Two panes in the other rules: Small (widest trailing pane, map card) and Extra Large (map in the header).
            shoot_layout "$IPAD" small ipad-12-landscape-small
            shoot_layout "$IPAD" extraLarge ipad-13-landscape-xl
            rotate Right || true
          else
            echo "::notice::The Simulator couldn't be rotated here; no ipad-9-landscape.png"
          fi
          killall Simulator 2>/dev/null || true   # not an Apple Event: that could wait on a permissions prompt
          cat "$OUT/report.txt"
      - name: Publish to ci-shots-ios branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cd "$RUNNER_TEMP/shots"
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-shots-ios
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "iPhone self-test for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots-ios
      - name: Fail on any failed check
        run: |
          grep -E "^FAIL" "$RUNNER_TEMP/shots/report.txt" | sed 's/^/::error::/' || true
          head -1 "$RUNNER_TEMP/shots/report.txt" | grep -q "ALL PASSED"
