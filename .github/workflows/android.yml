name: Android

# Builds the Android app, runs the unit tests (coordinate formats, sun and moon, distances and the nearest
# place, against Tests/fixtures/geo.json and Resources/Cities.tsv; the layout planner's golden table), then runs the app in the Android
# emulator placed at Maroon Bells, Colorado (the self-test: location fix, live ground elevation, place
# name, compass and declination, the widget's data, the layout planner's golden table) and photographs the
# terms, the live screen, the sample place, night mode, larger and accessibility text, every layout, the map
# sheet, the no-compass state ("No heading", Medium and Extra Large), the sample with nothing locked and the store
# screenshots. Results go to the ci-shots-android branch; the job fails if any check fails. The APKs and the App
# Bundle are kept as an artifact. Runs started by hand or by the release workflows (workflow_dispatch on main)
# then send the signed App Bundle to Google Play's closed test (docs/play/README.md).
on:
  push:
    branches: [main]
    paths: ["android/**", "Tests/fixtures/**", "docs/*.json", "Resources/Cities.tsv", "VERSION", "scripts/android-selftest.sh", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          LOG="$RUNNER_TEMP/gradle.txt"
          if ! ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease testDebugUnitTest > "$LOG" 2>&1; then
            # Compiler errors and failed tests as annotations, then the tail of the log.
            grep -E "^e: |FAILED|AAPT: error|error:" "$LOG" | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -60 "$LOG"; exit 1
          fi
          grep -hoE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+"' app/build/test-results/testDebugUnitTest/*.xml \
            | awk -F'"' '{t+=$2; f+=$6} END {print "::notice::Android unit tests: " t " run, " f " failed"}'
          ls -la app/build/outputs/apk/*/ app/build/outputs/bundle/release/
          # Which key signed the release APK: the permanent one (from the secrets) or a throwaway debug key.
          SIGNER=$("$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 "certificate DN" | sed 's/.*certificate DN: //')
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then echo "::notice::Release APK signed with the permanent key ($SIGNER)"; else echo "::warning::Release APK signed with a debug key ($SIGNER): add the ANDROID_KEYSTORE secrets"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bearings-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Attach the APK to the release
        # The Android download (releases/latest/download/Bearings.apk) follows main: each build on main
        # replaces the APK on the current version's release.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Bearings.apk"
            gh release upload "$TAG" "$RUNNER_TEMP/Bearings.apk" --clobber
            echo "::notice::Bearings.apk attached to $TAG"
          else
            echo "::warning::No release $TAG yet; the APK wasn't attached"
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: scripts/android-selftest.sh android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/shots"
      - name: Publish the results
        if: always()
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/commit.txt"
          REPORT="$OUT/report.txt"
          [ -f "$REPORT" ] && grep -E "^FAIL" "$REPORT" | while IFS= read -r line; do echo "::error::${line}"; done
          [ -f "$REPORT" ] && echo "::notice::Android self-test: $(head -1 "$REPORT")"
          cd "$OUT"
          git init -q && B="ci-shots-android"; [ "$GITHUB_REF" = refs/heads/main ] || B="ci-shots-android-preview"; git checkout -q -b "$B"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Android CI screenshots for $(cat commit.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
          # Every layout, the map sheet, the no-compass states and larger and accessibility text photographed
          # (docs/LAYOUTS.md §8).
          for F in android-3-sample android-7-small android-8-large android-9-xl android-11-map-sheet android-12-no-compass android-14-no-compass-xl android-6-large-text android-10-xl-large-text android-13-ax-text; do
            [ -s "$F.png" ] || { echo "::error::No $F.png"; exit 1; }
          done
          head -1 report.txt | grep -q "^ALL PASSED"
      - name: Google Play closed test
        # Only builds meant for testers: runs on main started by hand or by release.yml / finish-release.yml after a
        # new version is published (both are workflow_dispatch), signed with the upload key, and only after the
        # self-test passed. Never a branch: the version code is main's commit count, which goes up with every
        # commit, so each new build is higher than the last; a second run of the same commit is skipped.
        if: env.HAS_PLAY == 'true' && env.HAS_UPLOAD_KEY == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: com.bradcowdrey.bearings
          PLAY_AAB: android/app/build/outputs/bundle/release/app-release.aab
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          export PLAY_RELEASE_NAME="$VERSION ($(git rev-list --count HEAD))"
          # What's new: the first paragraph of this version's CHANGELOG entry.
          export PLAY_RELEASE_NOTES="$(awk -v v="## [$VERSION]" 'index($0, v) == 1 { f = 1; next } f && /^## / { exit } f && NF { p = p (p ? " " : "") $0; next } f && p { exit } END { print p }' CHANGELOG.md | sed 's/\*\*//g')"
          echo "Release $PLAY_RELEASE_NAME: $PLAY_RELEASE_NOTES"
          pip install --quiet pyjwt cryptography
          python3 .github/scripts/play_publish.py
