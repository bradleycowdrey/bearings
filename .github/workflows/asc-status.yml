name: App Store Connect status

# Read-only: shows the Bearings app record and its recent builds with their TestFlight state.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet "pyjwt[crypto]"
          ASC_ICONS_DIR="$RUNNER_TEMP/icons" python3 scripts/asc-builds.py
      - name: Publish the build icons to the ci-asc-icons branch
        run: |
          [ -d "$RUNNER_TEMP/icons" ] || exit 0
          cd "$RUNNER_TEMP/icons"
          git init -q -b ci-asc-icons && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build icons as App Store Connect sees them"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-asc-icons
