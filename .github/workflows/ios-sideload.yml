name: iPhone sideload IPA

# Builds an unsigned Bearings.ipa and attaches it to the current version's release, for people who
# install apps with AltStore or Sideloadly (which sign it with their own Apple ID) until Bearings is on
# the App Store. Most people should use the public TestFlight link instead. Runs when the app's code or
# VERSION changes on main, after a release is published (release.yml starts it), or on demand.
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Resources/**", "project.yml", "VERSION", ".github/workflows/ios-sideload.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build the unsigned IPA
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --quiet
          LOG="$RUNNER_TEMP/build.log"
          xcodebuild -project Bearings.xcodeproj -scheme BearingsPhone -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Bearings.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD 2>/dev/null || echo 1)" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive > "$LOG" 2>&1 \
            || { grep -E "(error|fatal):" "$LOG" | sort -u | head -25 | sed 's/^/::error::/'; tail -40 "$LOG"; exit 1; }
          APP="$RUNNER_TEMP/Bearings.xcarchive/Products/Applications/Bearings.app"
          [[ -d "$APP/PlugIns/BearingsWidget.appex" ]] || { echo "::error::The widget extension is missing from the app"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload" && cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Bearings.ipa" Payload)
          ls -l "$RUNNER_TEMP/Bearings.ipa"
      - name: Attach it to the release
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/Bearings.ipa" --clobber
            echo "::notice::Bearings.ipa attached to $TAG"
          else
            echo "::warning::No release $TAG yet; the IPA wasn't attached (release.yml starts this again once it publishes)"
          fi
