name: App Store listing

# Takes the App Store screenshots (6.9-inch iPhone and 13-inch iPad) in the Simulator, each launched with
# --store (the sample place without its Sample pill, on today's date, so the location bar agrees with the
# date in the status bar): the layouts the listing's story needs and the map sheet, plus, on iPhone, the
# widgets as the self-test draws them. scripts/store-frames.js then sets each capture in a drawn device on
# the Bearings sky under its headline (6 iPhone frames, 4 iPad). The raw captures are kept apart (raw/);
# the framed screenshots are what is uploaded. If asked, it then uploads them with the listing in
# fastlane/metadata: name, subtitle, description, keywords, links,
# categories, plus content rights, age rating, price (Free) and availability. Never uploads a build
# and never submits for review. The screenshots, and the raw captures in raw/, also go to the
# ci-appstore branch for review.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the listing and screenshots to App Store Connect"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  listing:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"; xcodebuild -version
      - name: Build for the Simulator
        run: scripts/build-ios.sh "$(tr -d '[:space:]' < VERSION)"
      - name: Screenshots
        run: |
          RAW="$RUNNER_TEMP/raw"; rm -rf "$RAW"; mkdir -p "$RAW"
          ID=com.bradcowdrey.bearings; export SIMCTL_CHILD_TZ=America/Denver
          # The status bar reads 9:41 (a plain time: an ISO date was not accepted by simctl and left the bar
          # showing the runner's clock).
          pick() {   # newest runtime's available device whose name matches $1
            xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          for rt in sorted(d, reverse=True):
              for dev in d[rt]:
                  if re.match(sys.argv[1], dev["name"]): print(dev["udid"]); sys.exit()' "$1"
          }
          shoot() {   # $1 device, $2 prefix, then one name:layout per capture (layout "map" = the map sheet)
            D="$1"; P="$2"; shift 2
            xcrun simctl boot "$D"; xcrun simctl bootstatus "$D" -b
            # A fresh Simulator shows first-boot banners (Apple Intelligence and the like) for a while;
            # let them pass so none lands in a store screenshot.
            sleep 90
            xcrun simctl ui "$D" appearance dark
            xcrun simctl status_bar "$D" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            xcrun simctl install "$D" dist/ios/Bearings.app
            xcrun simctl privacy "$D" grant location $ID || true
            xcrun simctl location "$D" set 39.09898,-106.94117 || true
            # --store is the sample without its Sample pill and on today's date; layout and format are named
            # so a stored choice can't change them.
            for shot in "$@"; do
              NAME="${shot%%:*}"; LAYOUT="${shot#*:}"
              if [ "$LAYOUT" = map ]; then args="--store --layout medium --format dd --map-sheet"; else args="--store --layout $LAYOUT --format dd"; fi
              F="$RAW/$P-$NAME.png"
              # A frame taken before the app has drawn is nearly empty (a small file): relaunch and retake it.
              for try in 1 2 3; do
                xcrun simctl terminate "$D" $ID 2>/dev/null || true
                xcrun simctl launch "$D" $ID $args; sleep $((8 + 6 * try))
                xcrun simctl io "$D" screenshot "$F"
                [ "$(stat -f%z "$F")" -gt 250000 ] && break
                echo "Screenshot $F looks blank; retaking"
              done
              [ "$(stat -f%z "$F")" -gt 250000 ] || { echo "::error::$F is still blank"; exit 1; }
            done
            xcrun simctl terminate "$D" $ID 2>/dev/null || true
          }
          # What scripts/store-frames.js frames: Extra Large (Compass), Small (Place & time), Medium
          # (Elevation; on iPad also Sun & moon), Large (Sun & moon on iPhone) and the map sheet (Map).
          PHONE="$(pick 'iPhone 1[6-9] Pro Max$')"
          shoot "$PHONE" iphone xl:extraLarge small:small medium:medium large:large map:map
          # The widgets for the iPhone's last frame, drawn by the self-test as in the iPhone workflow (ios.yml),
          # from a real location fix. Without them the iPhone set has 5 frames.
          DOCS="$(xcrun simctl get_app_container "$PHONE" $ID data)/Documents"; mkdir -p "$DOCS"; rm -f "$DOCS/report.txt"
          xcrun simctl launch "$PHONE" $ID --selftest
          for i in $(seq 1 150); do [ -f "$DOCS/report.txt" ] && break; sleep 1; done
          sleep 2
          for W in widget-large widget-lock-rectangular widget-lock-circular; do
            cp "$DOCS/$W.png" "$RAW/" || echo "::warning::The self-test drew no $W.png, so there is no widgets frame"
          done
          xcrun simctl terminate "$PHONE" $ID 2>/dev/null || true
          xcrun simctl shutdown "$PHONE" || true
          PAD="$(pick 'iPad Pro 13')"
          shoot "$PAD" ipad xl:extraLarge medium:medium map:map
          xcrun simctl shutdown "$PAD" || true
          sips -g pixelWidth -g pixelHeight "$RAW"/*.png
          [ "$(ls "$RAW"/iphone-*.png "$RAW"/ipad-*.png | wc -l)" -eq 8 ] || { echo "::error::Expected 8 raw screenshots"; exit 1; }
      - name: Frame the screenshots
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          SHOTS=fastlane/screenshots/en-US; rm -rf fastlane/screenshots; mkdir -p "$SHOTS"
          node scripts/store-frames.js --in "$RUNNER_TEMP/raw" --out "$SHOTS"
          # The sizes App Store Connect takes: 6.9-inch iPhone 1320 x 2868, 13-inch iPad 2064 x 2752.
          for F in "$SHOTS"/*.png; do
            S="$(sips -g pixelWidth -g pixelHeight "$F" | awk '/pixel/ {printf "%s ", $2}')"
            case "$(basename "$F")" in
              iphone-*) [ "$S" = "1320 2868 " ] ;;
              ipad-*) [ "$S" = "2064 2752 " ] ;;
              *) false ;;
            esac || { echo "::error::$F is $S"; exit 1; }
          done
          NP=$(ls "$SHOTS"/iphone-*.png | wc -l); NI=$(ls "$SHOTS"/ipad-*.png | wc -l)
          [ "$NP" -ge 5 ] && [ "$NI" -eq 4 ] || { echo "::error::Expected 6 (or 5) iPhone and 4 iPad screenshots, got $NP and $NI"; exit 1; }
          ls -l "$SHOTS"
      - name: Publish the screenshots for review (ci-appstore branch)
        run: |
          D="$RUNNER_TEMP/pub"; mkdir -p "$D/raw"; cp fastlane/screenshots/en-US/*.png "$D/"; cp "$RUNNER_TEMP"/raw/*.png "$D/raw/"
          cd "$D"; git init -q -b ci-appstore; git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "App Store screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-appstore
      - name: Upload the listing to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        run: |
          brew install fastlane >/dev/null; export PATH="$(brew --prefix)/bin:$PATH"
          python3 -c 'import json, os; json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": os.environ["ASC_KEY_P8"], "in_house": False}, open("fastlane/api_key.json", "w"))'
          fastlane listing version:"$(tr -d '[:space:]' < VERSION)" 2>&1 | grep -v -i -E "BEGIN PRIVATE|issuer_id|key_id" ; rc=${PIPESTATUS[0]}
          rm -f fastlane/api_key.json; exit $rc
